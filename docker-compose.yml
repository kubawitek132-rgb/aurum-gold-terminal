services:
  aurum:
    build: .
    image: aurum-gold-terminal:latest
    container_name: aurum
    restart: unless-stopped
    env_file: .env
    # Domyślnie dostępne tylko lokalnie na VPS — wystaw przez nginx/Caddy z HTTPS i hasłem.
    # Jeśli chcesz bezpośrednio: zmień na "3000:3000".
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - aurum-data:/app/.data   # stan: wysłany skrót dnia, migawki chokepointów
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Opcjonalny trwały cache. Uruchom: docker compose --profile redis up -d
  # i ustaw w .env: REDIS_URL=redis://redis:6379
  redis:
    image: redis:7-alpine
    container_name: aurum-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--save", "300", "1", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - aurum-redis:/data

volumes:
  aurum-data:
  aurum-redis:
